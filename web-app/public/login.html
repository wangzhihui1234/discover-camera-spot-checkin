<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · 机位打卡</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="app-header"></div>

    <div class="auth-wrap">
      <div class="card auth-card">
        <div class="auth-tabs">
          <button id="tab-login" class="active">登录</button>
          <button id="tab-register">注册</button>
        </div>

        <div id="auth-error" class="error-box" style="display: none"></div>

        <div class="field">
          <label for="username">用户名</label>
          <input id="username" class="input" placeholder="3-20 位字母、数字或下划线" autocomplete="username" />
        </div>

        <div class="field" id="nickname-field" style="display: none">
          <label for="nickname">昵称（可选）</label>
          <input id="nickname" class="input" placeholder="不填则默认用用户名" />
        </div>

        <div class="field">
          <label for="password">密码</label>
          <input id="password" class="input" type="password" placeholder="至少 6 位" autocomplete="current-password" />
        </div>

        <button id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 11px">登录</button>

        <p style="color: #6b7280; font-size: 12.5px; margin: 16px 0 0">
          提示：<b>第一个注册的账号会自动成为管理员</b>，可以审核其他用户发布的机位。
        </p>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
